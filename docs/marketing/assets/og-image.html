<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #0d233a 0%, #16324f 60%, #1e3a5f 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "IBM Plex Mono", monospace;
  }
  .wrap { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .peaks { position: absolute; right: -60px; bottom: -40px; width: 520px; opacity: 0.14; }
  .mark { width: 108px; height: auto; margin-bottom: 28px; }
  .mantra { font-size: 20px; letter-spacing: 0.22em; text-transform: uppercase; color: #10b981; margin-bottom: 18px; }
  .word { font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 88px; color: white; line-height: 0.95; letter-spacing: 0.01em; text-align: center; }
  .word span { font-weight: 500; opacity: 0.75; display: block; font-size: 60px; letter-spacing: 0.08em; }
  .sub { margin-top: 26px; font-size: 18px; color: rgba(255,255,255,0.68); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="peaks" viewBox="0 0 168 108"><polygon points="8,100 30,50 52,100" fill="white"/><polygon points="50,100 80,18 112,100" fill="white"/><polygon points="102,100 132,42 160,100" fill="white"/></svg>
    <svg class="mark" viewBox="0 0 168 108">
      <polygon points="8,100 30,50 52,100" fill="white"/>
      <polygon points="50,100 80,18 112,100" fill="white"/>
      <polygon points="102,100 132,42 160,100" fill="white"/>
    </svg>
    <div class="mantra">Evidence Over Guesswork</div>
    <div class="word">ZAGROS<span>DATAWARE</span></div>
    <div class="sub">Enterprise Process &nbsp;·&nbsp; Startup Enablement &nbsp;·&nbsp; Web Design</div>
  </div>
</body>
</html>
