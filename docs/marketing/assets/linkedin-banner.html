<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; }
  body {
    background: linear-gradient(120deg, #0d233a 0%, #16324f 55%, #1e3a5f 100%);
    display: flex;
    align-items: center;
    font-family: "IBM Plex Mono", monospace;
    padding: 0 100px 0 300px;
  }
  .peaks { position: absolute; right: 40px; bottom: -60px; width: 420px; opacity: 0.16; }
  .row { display: flex; align-items: center; gap: 40px; position: relative; z-index: 2; }
  .mark { width: 84px; height: auto; flex-shrink: 0; }
  .word { font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 58px; color: white; line-height: 0.95; }
  .word span { font-weight: 500; opacity: 0.75; display: block; font-size: 40px; letter-spacing: 0.08em; }
  .divider { width: 1px; height: 90px; background: rgba(255,255,255,0.2); }
  .right { max-width: 560px; }
  .mantra { font-size: 16px; letter-spacing: 0.18em; text-transform: uppercase; color: #10b981; margin-bottom: 10px; }
  .desc { font-size: 20px; color: rgba(255,255,255,0.75); line-height: 1.5; }
</style>
</head>
<body>
  <svg class="peaks" viewBox="0 0 168 108"><polygon points="8,100 30,50 52,100" fill="white"/><polygon points="50,100 80,18 112,100" fill="white"/><polygon points="102,100 132,42 160,100" fill="white"/></svg>
  <div class="row">
    <svg class="mark" viewBox="0 0 168 108">
      <polygon points="8,100 30,50 52,100" fill="white"/>
      <polygon points="50,100 80,18 112,100" fill="white"/>
      <polygon points="102,100 132,42 160,100" fill="white"/>
    </svg>
    <div class="word">ZAGROS<span>DATAWARE</span></div>
    <div class="divider"></div>
    <div class="right">
      <div class="mantra">Evidence Over Guesswork</div>
      <div class="desc">Enterprise process discipline, startup validation speed, and process-minded web design.</div>
    </div>
  </div>
</body>
</html>
